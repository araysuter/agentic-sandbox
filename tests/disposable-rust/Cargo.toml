[package]
name = "disposable-policy-tests"
version = "0.1.0"
edition = "2021"
publish = false

# Import the production modules directly, without the management workspace's
# full management dependency graph. This tests implementation, not copies or mocks.
[workspace]

[dependencies]
anyhow = "1"
async-trait = "0.1"
async-stream = "0.3"
axum = "0.8"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
flate2 = "1"
futures-util = "0.3"
hex = "0.4"
libc = "0.2"
parking_lot = "0.12"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tar = "0.4"
tokio = { version = "1", features = ["full", "test-util"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"
