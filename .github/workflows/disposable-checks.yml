name: Disposable session portable checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
      LOCAL_TEST_JOBS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Format production modules and portable Rust harness
        run: |
          cargo fmt --manifest-path management/Cargo.toml -- --check
          cargo fmt --manifest-path tests/disposable-rust/Cargo.toml -- --check
      - name: Test with fixture services only
        run: make test-disposable
