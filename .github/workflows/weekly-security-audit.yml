name: Disposable VM security audit
on:
  workflow_call:
    inputs:
      harness_sha:
        description: Reviewed immutable commit of araysuter/agentic-sandbox (same SHA as reusable workflow)
        required: true
        type: string
      model_id:
        default: studio
        type: string
      scheduled:
        description: Apply the local 1 AM DST duplicate guard
        default: false
        type: boolean
    secrets:
      HOST_AUDIT_TOKEN:
        description: Controller administration token; remains on trusted host
        required: true
permissions:
  contents: read
  issues: write
jobs:
  audit:
    # Dedicated trusted runner, never a public/untrusted fork-PR runner.
    runs-on: [self-hosted, linux, x64, isolated-security-audit]
    timeout-minutes: 310
    steps:
      - name: Validate trusted workflow context
        env:
          HARNESS_SHA: ${{ inputs.harness_sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          python3 - <<'PY'
          import os, re
          if not re.fullmatch(r'[a-f0-9]{40}', os.environ['HARNESS_SHA']):
              raise SystemExit('Pin harness_sha to a reviewed 40-character commit')
          if os.environ['EVENT_NAME'] not in ('schedule', 'workflow_dispatch') or os.environ['REF_TYPE'] != 'branch':
              raise SystemExit('Only trusted scheduled/manual branch workflows may use this runner')
          PY
      - name: Checkout only the reviewed harness (never audited repository code)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: araysuter/agentic-sandbox
          ref: ${{ inputs.harness_sha }}
          persist-credentials: false
          path: audit-harness
          sparse-checkout: scripts/security-audit
          sparse-checkout-cone-mode: true
      - name: Run host admission, bounded staging, collection and publication
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOST_AUDIT_TOKEN: ${{ secrets.HOST_AUDIT_TOKEN }}
          AUDIT_REPOSITORY: ${{ github.repository }}
          AUDIT_COMMIT: ${{ github.sha }}
          AUDIT_RUN_ID: ${{ github.run_id }}
          AUDIT_REF: ${{ github.ref_name }}
          AUDIT_MODEL_ID: ${{ inputs.model_id }}
          AUDIT_SCHEDULED: ${{ inputs.scheduled }}
          AUDIT_SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          args=()
          if [[ "$AUDIT_SCHEDULED" == true ]]; then args+=(--scheduled --schedule-expression "$AUDIT_SCHEDULE_EXPRESSION"); fi
          python3 audit-harness/scripts/security-audit/audit_client.py \
            --repository "$AUDIT_REPOSITORY" --commit "$AUDIT_COMMIT" \
            --run-id "$AUDIT_RUN_ID" --ref "$AUDIT_REF" \
            --model-id "$AUDIT_MODEL_ID" --output "$RUNNER_TEMP/audit-$AUDIT_RUN_ID" "${args[@]}"
      - name: Upload only redacted, host-validated reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-audit-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/audit-${{ github.run_id }}/report.redacted.json
            ${{ runner.temp }}/audit-${{ github.run_id }}/publication.json
            ${{ runner.temp }}/audit-${{ github.run_id }}/summary.md
          if-no-files-found: ignore
          retention-days: 14
