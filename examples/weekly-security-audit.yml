# Copy to each audited repository's .github/workflows/security-audit.yml.
# Replace BOTH SHA placeholders with the same reviewed fork commit, without a submodule.
# This example uses Tuesday local nights; assign another weekday to every other repo.
name: Weekly security audit
on:
  schedule:
    - cron: '0 5 * * 2' # 1 AM EDT; duplicate guard skips this entry during EST
    - cron: '0 6 * * 2' # 1 AM EST; duplicate guard skips this entry during EDT
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  audit:
    uses: araysuter/agentic-sandbox/.github/workflows/weekly-security-audit.yml@REPLACE_WITH_REVIEWED_40_CHARACTER_SHA
    with:
      harness_sha: REPLACE_WITH_REVIEWED_40_CHARACTER_SHA
      model_id: studio
      scheduled: ${{ github.event_name == 'schedule' }}
    secrets:
      HOST_AUDIT_TOKEN: ${{ secrets.HOST_AUDIT_TOKEN }}
